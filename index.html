<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>קוראים אנגלית</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f8fc;color:#182230}.wrap{max-width:900px;margin:auto;padding:24px}.hero{text-align:center;padding:26px 0}.hero h1{font-size:clamp(30px,6vw,52px);margin:0 0 8px}.hero p,.muted{color:#64748b}.card{background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:24px;box-shadow:0 10px 30px #0f172a0d;margin-bottom:18px}textarea{width:100%;min-height:220px;border:2px solid #e2e8f0;border-radius:18px;padding:20px;font-size:19px;line-height:1.7;direction:ltr;text-align:left;resize:vertical}button{border:0;border-radius:15px;padding:14px 20px;font-size:17px;font-weight:700;cursor:pointer;margin:5px;background:#4f46e5;color:#fff}.secondary{background:#eef2ff;color:#4338ca}.danger{background:#fff1f2;color:#be123c}.text{direction:ltr;text-align:left;font-size:24px;line-height:2;padding:12px}.bad{background:#fee2e2;color:#b91c1c;border-radius:7px;padding:2px 4px}.hidden{display:none}.status{padding:14px;border-radius:14px;background:#f1f5f9;margin:12px 0;text-align:center}.listening{background:#ecfdf5;color:#047857;border:2px solid #6ee7b7}.pulse{display:inline-block;width:12px;height:12px;background:#ef4444;border-radius:50%;margin-left:8px;animation:p 1s infinite}@keyframes p{50%{opacity:.25;transform:scale(1.35)}}.live{direction:ltr;text-align:left;color:#475569;font-size:16px;min-height:25px;margin-top:8px}.wordbox{text-align:center}.actions{text-align:center;margin-top:15px}@media(max-width:600px){.wrap{padding:14px}.card{padding:17px}.text{font-size:20px}button{width:100%;margin:5px 0}}
</style></head><body><main class="wrap"><header class="hero"><h1>📖 קוראים אנגלית</h1><p>שומעים. קוראים. משתפרים.</p></header>
<section id="setup" class="card"><h2>איזה טקסט נלמד היום?</h2><p class="muted">הדביקו כאן טקסט באנגלית.</p><textarea id="input">Last Saturday, Tom went to the beach with his family. They played in the sand and swam in the sea. Tom found a beautiful shell and showed it to his sister.</textarea><div class="actions"><button id="start">בוא נלמד ←</button></div></section>
<section id="learn" class="hidden"><div class="card"><div id="text" class="text"></div><div class="actions"><button id="speak">🔊 הקרא לי</button><button id="read">🎤 עכשיו אני קורא</button><button id="restart" class="secondary">↻ התחל קריאה מחדש</button></div><div id="status" class="status">אפשר קודם לשמוע את הטקסט, ואז לקרוא אותו בעצמך.</div><div id="live" class="live"></div></div>
<div id="practice" class="card hidden wordbox"><h3>מילים שכדאי לתרגל</h3><div id="words"></div></div>
<div class="card"><h3>🧠 הבנתי את הטקסט</h3><p class="muted">אחרי הקריאה, ספר לעצמך: מי מופיע בטקסט? מה קרה? ומה הפרט החשוב ביותר?</p><div class="actions"><button class="secondary" onclick="location.reload()">📄 טקסט חדש</button></div></div></section></main>
<script>
let original='',rec=null,isListening=false,transcript='';const $=x=>document.getElementById(x);
function words(s){return s.toLowerCase().replace(/[^a-z' ]/g,' ').split(/\s+/).filter(Boolean)}
$('start').onclick=()=>{original=$('input').value.trim();if(!original)return;$('setup').classList.add('hidden');$('learn').classList.remove('hidden');resetReading()}
function render(bad=[]){const set=new Set(bad);$('text').innerHTML=original.split(/(\s+)/).map(x=>{let w=x.toLowerCase().replace(/[^a-z']/g,'');return w&&set.has(w)?'<span class="bad">'+x+'</span>':x}).join('')}
$('speak').onclick=()=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(original);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u);setStatus('🔊 מקשיבים לטקסט...',false)}
function setStatus(html,listening){$('status').innerHTML=html;$('status').classList.toggle('listening',listening)}
function resetReading(){if(rec&&isListening){try{rec.abort()}catch(e){}}isListening=false;transcript='';render();$('practice').classList.add('hidden');$('live').textContent='';$('read').textContent='🎤 עכשיו אני קורא';setStatus('מוכנים לקריאה חדשה. לחץ על המיקרופון והתחל לקרוא.',false)}
$('restart').onclick=resetReading;
$('read').onclick=()=>{if(isListening){rec.stop();return}startRecognition()}
function startRecognition(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){setStatus('זיהוי דיבור אינו נתמך בדפדפן הזה. מומלץ לפתוח ב-Chrome.',false);return}transcript='';rec=new SR();rec.lang='en-US';rec.continuous=true;rec.interimResults=true;
rec.onstart=()=>{isListening=true;$('read').textContent='⏹ סיים קריאה';setStatus('<span class="pulse"></span><b>מקשיב עכשיו...</b> קרא את הטקסט בקול.',true)}
rec.onresult=e=>{let all='';for(let i=0;i<e.results.length;i++)all+=e.results[i][0].transcript+' ';transcript=all.trim();$('live').textContent=transcript?'שמעתי: '+transcript:''}
rec.onerror=e=>{if(e.error==='not-allowed')setStatus('לא התקבלה הרשאה למיקרופון. אשר שימוש במיקרופון בדפדפן ונסה שוב.',false);else if(e.error!=='aborted')setStatus('לא הצלחתי לשמוע. אפשר ללחוץ ולנסות שוב.',false)}
rec.onend=()=>{let was=isListening;isListening=false;$('read').textContent='🎤 קרא שוב';$('status').classList.remove('listening');if(was&&transcript)analyze(transcript);else if(was)setStatus('לא זיהיתי דיבור. לחץ על "קרא שוב" ונסה שוב.',false)}
try{rec.start()}catch(e){setStatus('המיקרופון לא התחיל. נסה שוב.',false)}}
function analyze(spoken){let expected=words(original),said=words(spoken),missing=[],pool=[...said];for(const w of expected){let i=pool.indexOf(w);if(i>=0)pool.splice(i,1);else missing.push(w)}missing=[...new Set(missing)];render(missing);setStatus(missing.length?'👏 יפה! יש <b>'+missing.length+'</b> מילים שכדאי לתרגל. אפשר לתרגל ואז ללחוץ <b>קרא שוב</b>.':'🎉 מצוין! קראת את כל המילים שזוהו. אפשר ללחוץ <b>קרא שוב</b> ולנסות פעם נוספת.',false);showPractice(missing)}
function showPractice(list){if(!list.length){$('practice').classList.add('hidden');return}$('practice').classList.remove('hidden');$('words').innerHTML=list.map(w=>'<button class="danger" data-word="'+w+'">'+w+' 🔊</button>').join('');$('words').querySelectorAll('button').forEach(b=>b.onclick=()=>practiceWord(b.dataset.word))}
function practiceWord(w){let u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.7;speechSynthesis.speak(u)}
</script></body></html>
