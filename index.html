<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Read English</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f8fc;color:#182230}.wrap{max-width:900px;margin:auto;padding:24px}.hero{text-align:center;padding:26px 0}.hero h1{font-size:clamp(30px,6vw,52px);margin:0 0 8px}.hero p{color:#64748b;font-size:18px}.card{background:white;border:1px solid #e5e7eb;border-radius:24px;padding:24px;box-shadow:0 10px 30px #0f172a0d;margin-bottom:18px}textarea{width:100%;min-height:220px;border:2px solid #e2e8f0;border-radius:18px;padding:20px;font-size:19px;line-height:1.7;direction:ltr;text-align:left;resize:vertical}button{border:0;border-radius:15px;padding:14px 20px;font-size:17px;font-weight:700;cursor:pointer;margin:5px;background:#4f46e5;color:white}.secondary{background:#eef2ff;color:#4338ca}.danger{background:#fff1f2;color:#be123c}.text{direction:ltr;text-align:left;font-size:24px;line-height:2;padding:12px}.bad{background:#fee2e2;color:#b91c1c;border-radius:7px;padding:2px 4px}.good{color:#15803d}.muted{color:#64748b}.hidden{display:none}.status{padding:14px;border-radius:14px;background:#f1f5f9;margin:12px 0}.wordbox{text-align:center}.wordbox strong{font-size:34px;direction:ltr;display:block}.actions{text-align:center;margin-top:15px}@media(max-width:600px){.wrap{padding:14px}.card{padding:17px}.text{font-size:20px}}
</style></head><body><main class="wrap"><header class="hero"><h1>📖 קוראים אנגלית</h1><p>שומעים. קוראים. משתפרים.</p></header>
<section id="setup" class="card"><h2>איזה טקסט נלמד היום?</h2><p class="muted">הדביקו כאן טקסט באנגלית.</p><textarea id="input">Last Saturday, Tom went to the beach with his family. They played in the sand and swam in the sea. Tom found a beautiful shell and showed it to his sister.</textarea><div class="actions"><button id="start">בוא נלמד ←</button></div></section>
<section id="learn" class="hidden"><div class="card"><div id="text" class="text"></div><div class="actions"><button id="speak">🔊 הקרא לי</button><button id="read">🎤 עכשיו אני קורא</button></div><div id="status" class="status">אפשר קודם לשמוע את הטקסט, ואז לקרוא אותו בעצמך.</div></div>
<div id="practice" class="card hidden wordbox"><h3>מילים שכדאי לתרגל</h3><div id="words"></div></div>
<div class="card"><h3>🧠 הבנתי את הטקסט</h3><p class="muted">אחרי הקריאה, ספר לעצמך: מי מופיע בטקסט? מה קרה? ומה הפרט החשוב ביותר?</p><div class="actions"><button class="secondary" onclick="location.reload()">📄 טקסט חדש</button></div></div></section></main>
<script>
let original='',rec;const $=x=>document.getElementById(x);
function words(s){return s.toLowerCase().replace(/[^a-z' ]/g,' ').split(/\s+/).filter(Boolean)}
$('start').onclick=()=>{original=$('input').value.trim();if(!original)return;$('setup').classList.add('hidden');$('learn').classList.remove('hidden');render();}
function render(bad=[]){const set=new Set(bad);$('text').innerHTML=original.split(/(\s+)/).map(x=>{let w=x.toLowerCase().replace(/[^a-z']/g,'');return w&&set.has(w)?'<span class="bad">'+x+'</span>':x}).join('')}
$('speak').onclick=()=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(original);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u);$('status').textContent='🔊 מקשיבים לטקסט...'}
$('read').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('status').innerHTML='זיהוי דיבור אינו נתמך בדפדפן הזה. מומלץ לפתוח ב-Chrome.';return}rec=new SR();rec.lang='en-US';rec.continuous=true;rec.interimResults=true;let final='';rec.onstart=()=>{$('status').textContent='🎤 אני מקשיב... קרא את הטקסט בקול.';$('read').textContent='⏹ סיים קריאה';$('read').onclick=()=>rec.stop()};rec.onresult=e=>{final='';for(let i=0;i<e.results.length;i++)final+=e.results[i][0].transcript+' '};rec.onend=()=>{analyze(final);$('read').textContent='🎤 קרא שוב';$('read').onclick=arguments.callee};rec.start()}
function analyze(spoken){let expected=words(original),said=words(spoken),missing=[];let pool=[...said];for(const w of expected){let i=pool.indexOf(w);if(i>=0)pool.splice(i,1);else missing.push(w)}missing=[...new Set(missing)];render(missing);$('status').innerHTML=missing.length?'👏 יפה! יש <b>'+missing.length+'</b> מילים שכדאי לתרגל.':'🎉 מצוין! קראת את כל המילים שזוהו.';showPractice(missing)}
function showPractice(list){if(!list.length){$('practice').classList.add('hidden');return}$('practice').classList.remove('hidden');$('words').innerHTML=list.map(w=>'<button class="danger" onclick="practiceWord(\''+w+'\')">'+w+' 🔊</button>').join('')}
window.practiceWord=w=>{let u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.7;speechSynthesis.speak(u)}
</script></body></html>
