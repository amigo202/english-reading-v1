<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>קוראים אנגלית</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(145deg,#eef7ff,#fff8ed);color:#12306b;min-height:100vh}.wrap{max-width:1050px;margin:auto;padding:22px}.hero{text-align:center;padding:22px 0 18px}.hero h1{font-size:clamp(34px,6vw,58px);margin:0;color:#163b8f;text-shadow:0 3px 0 #fff}.hero h1::first-letter{filter:drop-shadow(0 2px 2px #0002)}.hero p{color:#31538e;font-size:19px;font-weight:700}.muted{color:#64748b}.card{background:#ffffffee;border:2px solid #dce8ff;border-radius:30px;padding:26px;box-shadow:0 16px 45px #31538e18;margin-bottom:20px}h2,h3{color:#173d8f}textarea{width:100%;min-height:220px;border:2px solid #cfe0ff;border-radius:22px;padding:20px;font-size:19px;line-height:1.7;direction:ltr;text-align:left;resize:vertical;background:#fbfdff}button{border:0;border-radius:18px;padding:14px 22px;font-size:17px;font-weight:800;cursor:pointer;margin:5px;background:linear-gradient(135deg,#315cff,#5948e8);color:white;box-shadow:0 7px 16px #315cff2b;transition:.15s transform,.15s box-shadow}button:hover{transform:translateY(-1px);box-shadow:0 9px 20px #315cff35}.secondary{background:#edf3ff;color:#3152b9;box-shadow:none}.danger{background:#fff0f2;color:#c62b49;box-shadow:none}.text{direction:ltr;text-align:left;font-size:25px;line-height:2;padding:20px;background:#f8fbff;border-radius:22px;border:1px solid #e1ebff;color:#15346d}.bad{background:#ffdfe5;color:#ba2440;border-radius:8px;padding:2px 5px}.hidden{display:none}.status{padding:16px 18px;border-radius:18px;background:#f0f5ff;margin:14px 0;text-align:center;color:#294a84}.listening{background:#ecfff5;color:#087a55;border:2px solid #73e1b4}.pulse{display:inline-block;width:12px;height:12px;background:#ff4966;border-radius:50%;margin-left:8px;animation:p 1s infinite}@keyframes p{50%{opacity:.25;transform:scale(1.35)}}.live{direction:ltr;text-align:left;color:#52637f;font-size:16px;min-height:25px;margin-top:8px;max-height:58px;overflow:hidden}.wordbox{text-align:center}.actions{text-align:center;margin-top:15px}.speed{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px 0}.speed button{background:#f1f5ff;color:#49618d;padding:10px 16px;font-size:14px;box-shadow:none}.speed button.active{background:linear-gradient(135deg,#315cff,#5948e8);color:white}.voicepick{display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap;margin:14px auto;padding:12px;background:#f7faff;border-radius:18px;max-width:650px}.voicepick select{max-width:330px;padding:11px 13px;border:1px solid #cbdaf6;border-radius:13px;background:white;font-size:14px;color:#334b79}.featurebar{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.feature{background:#fff;border-radius:22px;padding:16px;text-align:center;font-weight:800;box-shadow:0 9px 25px #31538e12;border:1px solid #e4ecff}.feature b{display:block;font-size:25px;margin-bottom:5px}.feature:nth-child(1) b{color:#3977ff}.feature:nth-child(2) b{color:#ff8b27}.feature:nth-child(3) b{color:#29b86f}.readActions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.readActions #read{background:linear-gradient(135deg,#ff4966,#ff6c72)}@media(max-width:650px){.wrap{padding:12px}.card{padding:17px;border-radius:24px}.text{font-size:20px;padding:14px}.featurebar{grid-template-columns:1fr 1fr 1fr}.feature{font-size:12px;padding:11px 5px}.feature b{font-size:21px}button{width:100%;margin:5px 0}.speed button{width:auto}.voicepick select{width:100%;max-width:none}}
</style></head><body><main class="wrap"><header class="hero"><h1>📖 קוראים אנגלית</h1><p>שומעים. קוראים. משתפרים.</p></header>
<section id="setup" class="card"><h2>איזה טקסט נלמד היום?</h2><p class="muted">הדביקו כאן טקסט באנגלית.</p><textarea id="input">Last Saturday, Tom went to the beach with his family. They played in the sand and swam in the sea. Tom found a beautiful shell and showed it to his sister.</textarea><div class="actions"><button id="start">בוא נלמד ←</button></div></section>
<section id="learn" class="hidden"><div class="featurebar"><div class="feature"><b>🔊</b>שומעים את הטקסט</div><div class="feature"><b>🎤</b>קוראים בקול</div><div class="feature"><b>⭐</b>מקבלים משוב</div></div><div class="card"><div id="text" class="text"></div><div class="actions"><button id="speak">🔊 הקרא לי</button><div class="voicepick"><span>🎙️ קול:</span><select id="voice"><option>טוען קולות באנגלית...</option></select><button id="voiceTest" class="secondary" type="button">▶️ בדיקת קול</button></div><div class="speed"><button data-rate=".62">🐢 לאט</button><button data-rate=".82" class="active">▶️ רגיל</button><button data-rate="1.05">⚡ מהר</button></div><div class="readActions"><button id="read">🎤 עכשיו אני קורא</button><button id="restart" class="secondary">↻ התחל קריאה מחדש</button></div></div><div id="status" class="status">אפשר קודם לשמוע את הטקסט, ואז לקרוא אותו בעצמך.</div><div id="live" class="live"></div></div>
<div id="practice" class="card hidden wordbox"><h3>מילים שכדאי לתרגל</h3><div id="words"></div></div>
<div class="card"><h3>🧠 הבנתי את הטקסט</h3><p class="muted">אחרי הקריאה, ספר לעצמך: מי מופיע בטקסט? מה קרה? ומה הפרט החשוב ביותר?</p><div class="actions"><button class="secondary" onclick="location.reload()">📄 טקסט חדש</button></div></div></section></main>
<script>
let original='',rec=null,isListening=false,transcript='',speechRate=.82,englishVoices=[];const $=x=>document.getElementById(x);
function words(s){return s.toLowerCase().replace(/[^a-z' ]/g,' ').split(/\s+/).filter(Boolean)}
$('start').onclick=()=>{original=$('input').value.trim();if(!original)return;$('setup').classList.add('hidden');$('learn').classList.remove('hidden');resetReading()}
function render(bad=[]){const set=new Set(bad);$('text').innerHTML=original.split(/(\s+)/).map(x=>{let w=x.toLowerCase().replace(/[^a-z']/g,'');return w&&set.has(w)?'<span class="bad">'+x+'</span>':x}).join('')}
function loadVoices(){const all=speechSynthesis.getVoices();englishVoices=all.filter(v=>/^en[-_]/i.test(v.lang));const sel=$('voice');if(!englishVoices.length){sel.innerHTML='<option>קול אנגלי ברירת מחדל</option>';return}const rank=v=>/natural|premium|enhanced|google|microsoft|samantha|ava|aria|jenny|guy/i.test(v.name)?0:1;englishVoices.sort((a,b)=>rank(a)-rank(b)||a.name.localeCompare(b.name));sel.innerHTML=englishVoices.map((v,i)=>'<option value="'+i+'">'+v.name+' · '+v.lang+'</option>').join('');}loadVoices();speechSynthesis.onvoiceschanged=loadVoices;function chosenVoice(){return englishVoices[Number($('voice').value)]||null}function say(text,rate=speechRate){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);let v=chosenVoice();if(v){u.voice=v;u.lang=v.lang}else u.lang='en-US';u.rate=rate;speechSynthesis.speak(u)}$('voiceTest').onclick=()=>say('Hello! Let’s read English together.');$('speak').onclick=()=>{say(original,speechRate);setStatus('🔊 מקשיבים לטקסט בקצב '+(speechRate<.7?'איטי':speechRate>1?'מהיר':'רגיל')+'...',false)};document.querySelectorAll('.speed button').forEach(b=>b.onclick=()=>{speechRate=Number(b.dataset.rate);document.querySelectorAll('.speed button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(speechSynthesis.speaking){speechSynthesis.cancel();$('speak').click()}})
function setStatus(html,listening){$('status').innerHTML=html;$('status').classList.toggle('listening',listening)}
function resetReading(){if(rec&&isListening){try{rec.abort()}catch(e){}}isListening=false;transcript='';render();$('practice').classList.add('hidden');$('live').textContent='';$('read').textContent='🎤 עכשיו אני קורא';setStatus('מוכנים לקריאה חדשה. לחץ על המיקרופון והתחל לקרוא.',false)}
$('restart').onclick=resetReading;
$('read').onclick=()=>{if(isListening){rec.stop();return}startRecognition()}
function startRecognition(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){setStatus('זיהוי דיבור אינו נתמך בדפדפן הזה. מומלץ לפתוח ב-Chrome.',false);return}transcript='';rec=new SR();rec.lang='en-US';rec.continuous=true;rec.interimResults=true;let finalText='';
rec.onstart=()=>{isListening=true;$('read').textContent='⏹ סיים קריאה';setStatus('<span class="pulse"></span><b>מקשיב עכשיו...</b> קרא את הטקסט בקול.',true)}
rec.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){let t=e.results[i][0].transcript.trim();if(e.results[i].isFinal)finalText+=(finalText?' ':'')+t;else interim+=(interim?' ':'')+t}transcript=(finalText+' '+interim).trim();$('live').textContent=transcript?'שומע אותך... '+transcript.split(/\\s+/).slice(-10).join(' '):''}
rec.onerror=e=>{if(e.error==='not-allowed')setStatus('לא התקבלה הרשאה למיקרופון. אשר שימוש במיקרופון בדפדפן ונסה שוב.',false);else if(e.error!=='aborted')setStatus('לא הצלחתי לשמוע. אפשר ללחוץ ולנסות שוב.',false)}
rec.onend=()=>{let was=isListening;isListening=false;$('read').textContent='🎤 קרא שוב';$('status').classList.remove('listening');if(was&&transcript)analyze(transcript);else if(was)setStatus('לא זיהיתי דיבור. לחץ על "קרא שוב" ונסה שוב.',false)}
try{rec.start()}catch(e){setStatus('המיקרופון לא התחיל. נסה שוב.',false)}}
function analyze(spoken){let expected=words(original),said=words(spoken),missing=[];let i=0,j=0;while(i<expected.length&&j<said.length){if(expected[i]===said[j]){i++;j++;continue}let found=-1;for(let k=j+1;k<Math.min(said.length,j+5);k++){if(said[k]===expected[i]){found=k;break}}if(found>=0){j=found;continue}missing.push(expected[i]);i++}while(i<expected.length)missing.push(expected[i++]);missing=[...new Set(missing)];render(missing);setStatus(missing.length?'👏 יפה! יש <b>'+missing.length+'</b> מילים שכדאי לתרגל. אפשר לתרגל ואז ללחוץ <b>קרא שוב</b>.':'🎉 מצוין! קראת את כל המילים שזוהו. אפשר ללחוץ <b>קרא שוב</b> ולנסות פעם נוספת.',false);showPractice(missing)}
function showPractice(list){if(!list.length){$('practice').classList.add('hidden');return}$('practice').classList.remove('hidden');$('words').innerHTML=list.map(w=>'<button class="danger" data-word="'+w+'">'+w+' 🔊</button>').join('');$('words').querySelectorAll('button').forEach(b=>b.onclick=()=>practiceWord(b.dataset.word))}
function practiceWord(w){say(w,.7)}
</script></body></html>
